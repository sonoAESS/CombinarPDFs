name: Builds

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefacto: CombinadorPDFs-windows-x64.exe
          - os: ubuntu-22.04
            artefacto: CombinadorPDFs-linux-x64.bin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Los intérpretes de setup-python incluyen tkinter; esta comprobación
      # lo verifica pronto para que un fallo sea evidente.
      - name: Comprobar soporte Tk
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compilar ejecutable
        run: pyinstaller --noconfirm --clean CombinadorPDFs.spec

      - name: Preparar artefacto (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/CombinadorPDFs
          mv dist/CombinadorPDFs "dist/${{ matrix.artefacto }}"

      - name: Preparar artefacto (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/CombinadorPDFs.exe "dist/${{ matrix.artefacto }}"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artefacto }}
          path: dist/${{ matrix.artefacto }}

      - name: Publicar en GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artefacto }}
          generate_release_notes: true
