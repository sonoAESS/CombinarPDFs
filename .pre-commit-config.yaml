repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        language: system
        files: ^(main\.py|src/combinadorpdfs/(main|gui|logic)\.py)$
        pass_filenames: false
        args:
          - main.py
          - src/combinadorpdfs/main.py
          - src/combinadorpdfs/gui.py
          - src/combinadorpdfs/logic.py
