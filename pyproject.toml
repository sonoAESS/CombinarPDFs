[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "combinador-pdfs"
version = "1.1.0"
description = "Aplicación de escritorio para combinar múltiples archivos PDF en uno solo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "sonoAESS" }]
keywords = ["pdf", "combinar", "tkinter", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "PyPDF2>=3.0.1",
    "sv-ttk>=2.6.1",
    "tkinterdnd2>=0.4",
]

[project.optional-dependencies]
dev = [
    "auto-py-to-exe>=2.46.0",
    "mypy>=1.13",
    "pillow>=11.3.0",
    "pre-commit>=4.0",
    "pyinstaller>=6.14.2",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
combinador-pdfs = "main:main"

[tool.setuptools]
py-modules = ["main", "pdf_logic", "pdf_gui"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
files = ["main.py", "pdf_logic.py", "pdf_gui.py", "tools"]
exclude = ["entorno/", "build/", "dist/"]

[[tool.mypy.overrides]]
# typeshed no tipa curselection()/nearest() de tkinter; las llamadas
# desde la GUI son correctas en tiempo de ejecución.
module = "pdf_gui"
disable_error_code = ["no-untyped-call"]